<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#101113"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="合约计算器"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>合约开仓计算器 · V3</title>
<style>
:root{color-scheme:dark;--bg:#111317;--panel:#1b1e24;--in:#111419;--line:#30353e;--muted:#a0a9b7;--text:#f0f3f8;--accent:#a6bfff;--green:#52d6a2;--red:#ff858b;--amber:#eac381}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}main{max-width:560px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}header{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:8px}h1{font-size:19px;margin:0;font-weight:680;letter-spacing:.2px}.version{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px}.reset{border:1px solid var(--line);background:none;border-radius:7px;padding:5px 10px;color:var(--muted);min-height:32px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{min-width:0;background:var(--in);border-radius:8px;padding:7px 9px}.metric span{display:block;font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:clamp(17px,5.3vw,25px);font-variant-numeric:tabular-nums;letter-spacing:-.45px;line-height:1.2;margin:3px 0;font-weight:670;overflow-wrap:anywhere}.metric small{display:block;font-size:10px;color:var(--muted)}.red{color:var(--red)!important}.green{color:var(--green)!important}.risk{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.risk strong{color:var(--text);font-size:12px;white-space:nowrap}.track{height:5px;flex:1;background:#383d46;border-radius:5px;overflow:hidden}.track div{height:100%;width:0;background:var(--amber);border-radius:5px}.warning{color:var(--amber);font-size:11px;line-height:1.35;margin:5px 0 0;white-space:pre-line}.warning:empty{display:none}.toggles,.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggles{margin-bottom:8px}.segment{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;background:var(--in);border:1px solid var(--line);border-radius:9px}.segment button{border:0;background:none;color:var(--muted);border-radius:6px;min-height:32px;font-size:13px;padding:3px}.segment button[aria-pressed=true]{background:#343b47;color:var(--text)}.segment button[data-value=short][aria-pressed=true]{color:var(--red);background:#462c34}.segment button[data-value=long][aria-pressed=true]{color:var(--green);background:#213d34}.field{min-width:0}.label{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.inputwrap{display:flex;align-items:center;background:var(--in);border:1px solid var(--line);border-radius:8px;padding:0 8px;gap:4px;min-width:0}.inputwrap:focus-within{border-color:var(--accent)}.inputwrap input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:16px;min-height:35px;font-weight:550;font-variant-numeric:tabular-nums;appearance:textfield;-moz-appearance:textfield}.inputwrap input::-webkit-inner-spin-button,.inputwrap input::-webkit-outer-spin-button{appearance:none;margin:0}.unit{font-size:10px;color:var(--muted);white-space:nowrap}.control{display:grid;grid-template-columns:1fr 92px;gap:0 9px;align-items:center;margin-top:8px}.controltop{display:flex;align-items:center;justify-content:space-between;grid-column:1;gap:5px}.controltop label{font-weight:550;font-size:12px}.helper{font-size:10px;color:var(--muted);white-space:nowrap}.control .inputwrap{grid-column:2;grid-row:1 / span 2}.slider{grid-column:1;width:100%;height:29px;appearance:none;background:transparent;cursor:pointer;margin:0;--fill:0%;touch-action:pan-y}.slider::-webkit-slider-runnable-track{height:5px;background:linear-gradient(90deg,var(--accent) 0 var(--fill),#3a404b var(--fill) 100%);border-radius:7px}.slider::-webkit-slider-thumb{appearance:none;width:23px;height:23px;margin-top:-9px;border-radius:50%;background:#f7f9ff;border:3px solid var(--accent)}.slider::-moz-range-track{height:5px;background:#3a404b;border-radius:7px}.slider::-moz-range-progress{height:5px;background:var(--accent)}.slider::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:white;border:2px solid var(--accent)}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:3px 0 8px}.quick button{border:1px solid var(--line);border-radius:6px;background:none;color:var(--muted);font-size:11px;min-height:28px;padding:2px}.quick button.active{background:#34405a;color:#d1dfff;border-color:#60739d}.targets{margin-top:6px}.extra{padding:0 10px}.extra summary,.scenario summary{cursor:pointer;min-height:36px;display:flex;align-items:center;justify-content:space-between;list-style:none;font-size:12px;color:var(--muted)}summary::-webkit-details-marker{display:none}summary:after{content:'＋';font-size:16px}details[open]>summary:after{content:'−'}.extra[open]{padding-bottom:10px}.mmrrow,.detail,.balance{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:12px}.mmrrow .inputwrap{width:90px}.detail span,.balance span{color:var(--muted)}.detail strong,.balance strong{font-variant-numeric:tabular-nums;font-weight:550}.balance{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}.balance strong{font-size:18px}.scenario{padding:0 10px}.tablewrap{overflow:auto;padding-bottom:8px}table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:400}th:first-child,td:first-child{text-align:left}footer{color:var(--muted);font-size:10px;line-height:1.5;margin:6px 2px}button:focus-visible,summary:focus-visible,.slider:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:360px){main{padding-left:7px;padding-right:7px}.panel{padding:8px}.metric{padding:6px}.metric strong{font-size:17px}.extra,.scenario{padding:0 8px}}@media(min-width:700px){main{padding-top:22px}}
</style></head><body><main><header><h1>合约计算器<span class="version">V3 · 精简版</span></h1><button class="reset" id="reset">↻ 重置</button></header>
<section class="panel results" aria-label="实时计算结果"><div class="metrics"><div class="metric"><span>预计强平价 · USD</span><strong class="red" id="liq">—</strong><small id="distance">—</small></div><div class="metric"><span>止盈盈利 · CNY</span><strong class="green" id="profit">—</strong><small id="roi">—</small></div><div class="metric"><span>止损亏损 · CNY</span><strong class="red" id="loss">—</strong><small id="lossPct">—</small></div><div class="metric"><span>理论盈亏比</span><strong id="rr">—</strong><small>盈利 / 亏损</small></div></div><div class="risk"><span>止损本金风险</span><div class="track"><div id="riskBar"></div></div><strong id="riskPct">—</strong></div><p class="warning" id="warning" role="status"></p><p id="riskHint" hidden></p></section>
<section class="panel params" aria-label="开仓参数"><div class="toggles"><div class="segment" id="mode" aria-label="保证金模式"><button data-value="cross" aria-pressed="true">全仓</button><button data-value="isolated" aria-pressed="false">逐仓</button></div><div class="segment" id="side" aria-label="交易方向"><button data-value="long" aria-pressed="false">做多</button><button data-value="short" aria-pressed="true">做空</button></div></div>
<div class="fields"><label class="field"><span class="label">账户总资金</span><div class="inputwrap"><input id="capital" type="number" inputmode="decimal" min="0" step="any" value="5500"><span class="unit">元</span></div></label><label class="field"><span class="label">开仓价格</span><div class="inputwrap"><input id="entry" type="number" inputmode="decimal" min="0" step="any" value="61351"><span class="unit">USD</span></div></label></div>
<div class="control"><div class="controltop"><label for="margin">开仓保证金</label><span class="helper" id="marginPct">—</span></div><div class="inputwrap"><input id="margin" type="number" inputmode="decimal" min="0" step="any" value="1300"><span class="unit">元</span></div><input class="slider" id="marginRange" aria-label="保证金滑块" type="range" min="0" max="5500" step="1" value="1300"></div>
<div class="control"><div class="controltop"><label for="lev">杠杆倍数</label><span class="helper">1–200倍</span></div><div class="inputwrap"><input id="lev" type="number" inputmode="numeric" min="1" max="200" step="1" value="50"><span class="unit">倍</span></div><input class="slider" id="levRange" aria-label="杠杆滑块" type="range" min="1" max="200" step="1" value="50"></div><div class="quick" id="quick"></div>
<div class="fields targets"><label class="field"><span class="label">止盈价格</span><div class="inputwrap"><input id="target" type="number" inputmode="decimal" min="0" step="any" value="57500"><span class="unit">USD</span></div></label><label class="field"><span class="label">止损价格</span><div class="inputwrap"><input id="stop" type="number" inputmode="decimal" min="0" step="any" value="64998"><span class="unit">USD</span></div></label></div></section>
<details class="panel extra"><summary>高级参数 · 详细数据</summary><div class="mmrrow"><label for="mmr">维持保证金率</label><div class="inputwrap"><input id="mmr" type="number" inputmode="decimal" min="0" step="any" value="0.5"><span class="unit">%</span></div></div><div class="details" id="details"></div><div class="balance"><span>止盈后账户总资金</span><strong class="green" id="balance">—</strong></div></details>
<details class="panel scenario"><summary>涨跌幅盈亏对照表</summary><div class="tablewrap"><table><thead><tr><th>涨跌幅</th><th>价格 USD</th><th>盈亏 元</th><th>权益 元</th></tr></thead><tbody id="scenarios"></tbody></table></div></details><footer>单仓线性合约估算，不含手续费、资金费及滑点。强平以交易所为准。止损不保证成交。</footer></main><script>
'use strict';
const $=id=>document.getElementById(id),defaults={capital:'5500',entry:'61351',margin:'1300',lev:'50',target:'57500',stop:'64998',mmr:'0.5',mode:'cross',side:'short'};let mode=defaults.mode,side=defaults.side;const ids=['capital','entry','margin','lev','target','stop','mmr'];const num=id=>$(id).value.trim()===''?NaN:Number($(id).value),fmt=x=>Number.isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—',cash=x=>Number.isFinite(x)?'¥'+fmt(x):'—',pct=x=>Number.isFinite(x)?fmt(x)+'%':'—';
function sync(){const c=num('capital');$('marginRange').max=Number.isFinite(c)&&c>0?c:1;$('marginRange').value=Number.isFinite(num('margin'))?num('margin'):0;$('levRange').value=Number.isFinite(num('lev'))?num('lev'):1;for(const k of ['marginRange','levRange']){const r=$(k);r.style.setProperty('--fill',((+r.value-+r.min)/(+r.max-+r.min)*100||0)+'%');}for(const b of $('quick').children)b.classList.toggle('active',Number(b.dataset.lev)===num('lev'));for(const k of ['mode','side'])for(const b of $(k).children)b.setAttribute('aria-pressed',String(b.dataset.value===(k==='mode'?mode:side)));$('marginPct').textContent=c>0?pct(num('margin')/c*100):'—';}
function detail(a,b){const d=document.createElement('div');d.className='detail';const s=document.createElement('span'),v=document.createElement('strong');s.textContent=a;v.textContent=b;d.append(s,v);return d;}
function calc(){sync();const c=num('capital'),p=num('entry'),m=num('margin'),l=num('lev'),r=num('mmr')/100,tp=num('target'),sl=num('stop'),n=m*l,short=side==='short',e=mode==='cross'?c:m;const valid=[c,p,m,l,r,n].every(Number.isFinite)&&c>0&&p>0&&m>0&&m<=c&&l>=1&&l<=200&&Number.isInteger(l)&&r>=0&&r<1/l; if(!valid){for(const id of ['liq','profit','loss','rr','riskPct','balance'])$(id).textContent='—';$('distance').textContent='距离开仓价 —';$('roi').textContent='保证金收益率 —';$('lossPct').textContent='账户本金 —';$('details').replaceChildren();$('scenarios').replaceChildren();$('riskBar').style.width='0';$('riskHint').textContent='请先填写有效参数。';$('warning').textContent='请检查输入：保证金必须为正且不超过账户资金，杠杆为 1–200 的整数，维持保证金率须低于初始保证金率。';return;}
const liq=short?p*(1+e/n)/(1+r):Math.max(0,p*(1-e/n)/(1-r)),pnl=x=>(short?p-x:x-p)*n/p,profit=tp>0&&pnl(tp)>0?pnl(tp):NaN,loss=sl>0&&pnl(sl)<0?-pnl(sl):NaN,hit=x=>short?x>=liq:liq>0&&x<=liq,beyond=Number.isFinite(loss)&&hit(sl),risk=loss/c*100;
$('liq').textContent=liq>0?'$'+fmt(liq):'无正值';$('distance').textContent=liq>0?'反向波动 '+pct(Math.abs(liq-p)/p*100):'模型下无正强平价';$('profit').textContent=cash(profit);$('roi').textContent='保证金收益率 '+pct(profit/m*100);$('loss').textContent=cash(loss);$('lossPct').textContent='账户本金 '+pct(risk);$('rr').textContent=Number.isFinite(profit/loss)?fmt(profit/loss)+' : 1':'—';$('riskPct').textContent=pct(risk);$('riskPct').className=risk>10?'red':risk>2?'':'green';$('riskBar').style.width=(Number.isFinite(risk)?Math.min(100,risk):0)+'%';$('riskBar').style.background=risk>10?'var(--red)':risk>2?'var(--amber)':'var(--green)';$('riskHint').textContent=beyond?'止损位触及预计强平区，可能先被强平。':!Number.isFinite(risk)?'填写符合交易方向的止损价格。':risk>10?'单笔止损超过账户本金 10%，风险很高。':'止损损失占账户总权益的估算比例。';
$('details').replaceChildren(...[['实际持仓价值',cash(n)],['实际账户杠杆',fmt(n/c)+' 倍'],['未占用初始保证金',cash(c-m)],['反向波动 1% 的亏损',cash(n*.01)],['止损后账户资金',beyond?'可能先被强平':cash(c-loss)],['主要保证金风险范围',cash(e)]].map(([a,b])=>detail(a,b)));$('balance').textContent=cash(c+profit);const w=[];if(beyond)w.push('止损达到或超过预计强平价，可能无法按止损价成交。');if(risk>10)w.push('单笔止损风险较高，请留意滑点与账户损失。');if(!Number.isFinite(profit)&&$('target').value)w.push('止盈价格方向不正确。');if(!Number.isFinite(loss)&&$('stop').value)w.push('止损价格方向不正确。');$('warning').textContent=w.join('\n');
$('scenarios').replaceChildren(...[20,15,10,5,3,1,0,-1,-3,-5,-10,-15,-20,-30,-40,-50].map(a=>{const x=p*(1+a/100),v=pnl(x),h=hit(x),tr=document.createElement('tr');[(a>0?'+':'')+a+'%',fmt(x),h?'已达预计强平区':(v>0?'+':'')+fmt(v),h?'—':fmt(c+v)].forEach((t,i)=>{const td=document.createElement('td');td.textContent=t;if(i===2)td.className=h||v<0?'red':v>0?'green':'';tr.append(td)});return tr}));}
for(const id of ids)$(id).addEventListener('input',calc);$('marginRange').addEventListener('input',()=>{$('margin').value=$('marginRange').value;calc()});$('levRange').addEventListener('input',()=>{$('lev').value=$('levRange').value;calc()});for(const k of ['mode','side'])for(const b of $(k).children)b.addEventListener('click',()=>{if(k==='mode')mode=b.dataset.value;else side=b.dataset.value;calc()});for(const l of [10,20,30,50,75,100]){const b=document.createElement('button');b.dataset.lev=l;b.textContent=l+'×';b.onclick=()=>{$('lev').value=l;calc()};$('quick').append(b)}$('reset').onclick=()=>{for(const id of ids)$(id).value=defaults[id];mode=defaults.mode;side=defaults.side;calc()};calc();
</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
